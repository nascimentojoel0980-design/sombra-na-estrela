<!doctype html>
<html lang="pt-PT">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Ficha do trilho — Sombra na Estrela</title>
<style>
  :root{--fundo:#FFFDF6;--tinta:#2B2620;--fraco:#8A8270;--linha:#E8E2D2;--laranja:#D8792B;--azul:#1E5BD8}
  body{margin:0;background:var(--fundo);color:var(--tinta);font:15px/1.45 system-ui,-apple-system,Segoe UI,Roboto,sans-serif}
  main{max-width:720px;margin:0 auto;padding:18px 16px 40px}
  h1{font-size:22px;margin:6px 0 2px}
  .sub{color:var(--fraco);font-size:13px;margin-bottom:14px}
  .bts{display:flex;flex-wrap:wrap;gap:8px;margin:12px 0 18px}
  .bt{border:1px solid var(--linha);background:#fff;border-radius:10px;padding:9px 13px;font:600 14px system-ui;color:var(--tinta);text-decoration:none;cursor:pointer}
  .bt.p{background:var(--laranja);border-color:var(--laranja);color:#fff}
  .grade{display:grid;grid-template-columns:repeat(auto-fill,minmax(150px,1fr));gap:10px;margin:8px 0 16px}
  .c{border:1px solid var(--linha);border-radius:12px;padding:10px 12px;background:#fff}
  .c b{display:block;font-size:20px;font-variant-numeric:tabular-nums}
  .c i{font-style:normal;color:var(--fraco);font-size:12px}
  h2{font-size:13px;letter-spacing:.08em;text-transform:uppercase;color:var(--fraco);margin:18px 0 8px}
  svg{width:100%;height:auto;display:block;background:#fff;border:1px solid var(--linha);border-radius:12px}
  .barra{display:flex;height:12px;border-radius:6px;overflow:hidden;margin:6px 0 4px}
  .barra i{flex:1}
  table{border-collapse:collapse;width:100%;font-size:13px}
  td,th{padding:5px 6px;border-bottom:1px solid var(--linha);text-align:left}
  th{color:var(--fraco);font-weight:600}
  .nota{color:var(--fraco);font-size:12px}
  #estado{color:var(--fraco);font-size:13px}
  #mapaCx{position:relative}
  #mapa2d{width:100%;display:block;border-radius:12px;border:1px solid var(--linha);background:#dcd8cc;touch-action:none}
  #mapaNota{position:absolute;right:8px;bottom:6px;background:rgba(255,253,246,.85);padding:2px 6px;border-radius:6px;font-size:10px}
  #perfil svg{touch-action:none;cursor:crosshair}
</style>
</head>
<body>
<main>
  <div id=estado>a ler…</div>
  <h1 id=nome></h1>
  <div class=sub id=sub></div>
  <div class=bts>
    <a class="bt p" id=mapa href="#">Mostrar no mapa 3D</a>
    <a class=bt id=gpx href="#" download>Descarregar GPX</a>
    <a class=bt id=kml href="#" download>Descarregar KML</a>
    <a class=bt id=earth href="#" target=_blank>Google Earth</a>
  </div>
  <div class=grade id=cartoes></div>
  <h2>Vista de cima (satélite) <span class=nota>Esri World Imagery · arrasta no perfil para ver o ponto</span></h2>
  <div id=mapaCx><canvas id=mapa2d></canvas><div id=mapaNota class=nota></div></div>
  <h2>Perfil de altitude <span class=nota id=perfilNota></span></h2>
  <div id=perfil></div>
  <h2>Sol ao longo do dia <span class=nota id=solNota></span></h2>
  <div id=sol></div>
  <h2>Zonas do terreno usadas</h2>
  <div id=zonas class=nota></div>
</main>
<script src="fonte/terreno.js?v=46"></script>
<script>
const $ = (id) => document.getElementById(id);
const esc = (t) => String(t == null ? '' : t).replace(/[&<>"]/g, (c) => ({ '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;' }[c]));
const km1 = (v) => v.toFixed(v < 10 ? 1 : 0) + ' km';
const hm = (s) => s == null ? '—' : (s / 3600 | 0) + 'h' + String(Math.round(s / 60) % 60).padStart(2, '0');
const q = new URLSearchParams(location.search);

async function carregaBD() {
  await new Promise((ok, ko) => { const sc = document.createElement('script'); sc.src = 'dados/dados.js'; sc.onload = ok; sc.onerror = ko; document.head.appendChild(sc); });
  return (window.__DATA__ && window.__DATA__.routes) || [];
}

async function trilho() {
  if (q.get('meu')) {
    let M = []; try { M = JSON.parse(localStorage.getItem('sne-meus-trilhos') || '[]'); } catch (e) {}
    const m = M.find((x) => x.id === +q.get('meu'));
    if (!m) throw new Error('este trilho não está neste telemóvel (os teus trilhos ficam guardados no aparelho onde os importaste)');
    return { nome: m.nome, sub: new Date(m.quando).toLocaleDateString('pt-PT') + ' · ' + m.origem, pts: m.pts, chave: 'meu:' + m.id, meu: true };
  }
  if (q.get('bd')) {
    const BD = await carregaBD();
    const r = BD.find((x) => String(x.id) === q.get('bd'));
    if (!r) throw new Error('percurso não encontrado');
    const partes = (r.geoe || []).map(descodificaPoly);
    const pts = partes.flat().map(([la, lo]) => ({ la, lo, z: null, t: null }));
    return { nome: r.nome, sub: (r.ref ? r.ref + ' · ' : '') + 'percurso da base de dados', pts, chave: 'bd:' + r.id, r };
  }
  throw new Error('falta ?meu=ID ou ?bd=ID');
}

// Um objecto "terreno" feito de varias zonas: cada ponto pergunta a zona que o
// contem. Serve para medeTrilho (cotas) e para somar sol e copa por zona.
function compoe(zs) {
  const lo0 = Math.min(...zs.map((z) => z.lo0)), la0 = Math.min(...zs.map((z) => z.la0));
  const lo1 = Math.max(...zs.map((z) => z.lo1)), la1 = Math.max(...zs.map((z) => z.la1));
  const mlon = zs[0].mlon, mlat = zs[0].mlat;
  const C = { lo0, la0, lo1, la1, mlon, mlat, zonas: zs };
  C.emM = (lo, la) => [(lo - lo0) * mlon, (la - la0) * mlat];
  C.emLL = (x, y) => [lo0 + x / mlon, la0 + y / mlat];
  C.cotaEm = (x, y) => {
    const [lo, la] = C.emLL(x, y);
    const z = zs.find((zz) => lo >= zz.lo0 && lo <= zz.lo1 && la >= zz.la0 && la <= zz.la1) || zs[0];
    const m = z.emM(lo, la); return z.cotaEm(m[0], m[1]);
  };
  return C;
}

(async () => {
  try {
    const t = await trilho();
    $('nome').textContent = t.nome; $('sub').textContent = t.sub; document.title = t.nome + ' — ficha';
    $('mapa').href = 'terreno.html?trilho=' + t.chave;
    // ficheiros
    const gpx = ['<?xml version="1.0" encoding="UTF-8"?>', '<gpx version="1.1" creator="Sombra na Estrela" xmlns="http://www.topografix.com/GPX/1/1">',
      '<trk><name>' + esc(t.nome) + '</name><trkseg>']
      .concat(t.pts.map((p) => '<trkpt lat="' + p.la.toFixed(6) + '" lon="' + p.lo.toFixed(6) + '">' + (p.z != null ? '<ele>' + p.z + '</ele>' : '') + (p.t ? '<time>' + new Date(p.t).toISOString() + '</time>' : '') + '</trkpt>'))
      .concat(['</trkseg></trk></gpx>']).join('\n');
    const kml = ['<?xml version="1.0" encoding="UTF-8"?>', '<kml xmlns="http://www.opengis.net/kml/2.2"><Document><name>' + esc(t.nome) + '</name>',
      '<Style id="t"><LineStyle><color>ff2b2bd8</color><width>4</width></LineStyle></Style>',
      '<Placemark><name>' + esc(t.nome) + '</name><styleUrl>#t</styleUrl><LineString><tessellate>1</tessellate><coordinates>',
      t.pts.map((p) => p.lo.toFixed(6) + ',' + p.la.toFixed(6) + (p.z != null ? ',' + p.z : '')).join(' '),
      '</coordinates></LineString></Placemark></Document></kml>'].join('\n');
    const nomeF = t.nome.replace(/[^\w\-]+/g, '_').slice(0, 40) || 'trilho';
    $('gpx').href = URL.createObjectURL(new Blob([gpx], { type: 'application/gpx+xml' })); $('gpx').download = nomeF + '.gpx';
    $('kml').href = URL.createObjectURL(new Blob([kml], { type: 'application/vnd.google-earth.kml+xml' })); $('kml').download = nomeF + '.kml';
    const meio = t.pts[Math.floor(t.pts.length / 2)];
    $('earth').href = 'https://earth.google.com/web/@' + meio.la.toFixed(6) + ',' + meio.lo.toFixed(6) + ',0a,6000d,35y,0h,55t,0r';

    // zonas que o trilho toca: finas primeiro; a geral so onde nao ha fina
    $('estado').textContent = 'a ler as zonas do terreno…';
    const idx = await (await fetch('dados/terreno/index.json')).json();
    const toca = (z) => t.pts.some((p) => p.lo >= z.caixa[0] && p.lo <= z.caixa[2] && p.la >= z.caixa[1] && p.la <= z.caixa[3]);
    const finas = idx.zonas.filter((z) => z.classe < 20 && toca(z));
    const cobre = (p) => finas.some((z) => p.lo >= z.caixa[0] && p.lo <= z.caixa[2] && p.la >= z.caixa[1] && p.la <= z.caixa[3]);
    const faltam = t.pts.filter((p) => !cobre(p)).length;
    const usar = finas.slice();
    if (faltam) for (const z of idx.zonas) if (z.classe >= 20 && toca(z)) usar.push(z);
    if (!usar.length) throw new Error('nenhuma zona cozida cobre este trilho');
    const Ts = [];
    for (const z of usar) { $('estado').textContent = 'a ler ' + z.titulo + '…'; Ts.push(Object.assign(await carregaTerreno('dados/terreno/' + z.ficheiro), { zona: z })); }
    $('zonas').innerHTML = usar.map((z) => esc(z.titulo) + ' (' + z.ficheiro.replace('.terr.gz', '') + ', células de ' + z.classe + ' m)').join(' · ')
      + (faltam ? '<br>' + faltam + ' pontos só têm a vista geral (50 m): cotas menos finas aí.' : '');
    const TC = compoe(Ts);
    const e = medeTrilho(TC, t.pts, { cotaDoGPS: !!t.meu });
    // copa e sol: por zona, somados
    let sob = 0, den = 0; for (const Z of Ts) { const c = copaNoTrilho(Z, t.pts); if (c) { sob += c.pct / 100 * c.dentro; den += c.dentro; } }
    const cartoes = [
      [km1(e.km), 'distância'], ['↗ ' + e.sobe + ' m', 'subida'], ['↘ ' + e.desce + ' m', 'descida'],
      [e.zmin + '–' + e.zmax + ' m', 'cotas (' + e.cotaDe + ')'], [hm(e.dur), 'duração'],
      [e.vel ? e.vel.toFixed(1) + ' km/h' : '—', 'velocidade média'],
      [den ? Math.round(100 * sob / den) + ' %' : '—', 'debaixo de árvores (copa ≥ 5 m)'],
      [e.pontos.toLocaleString('pt-PT'), 'pontos'],
    ];
    $('cartoes').innerHTML = cartoes.map(([v, l]) => '<div class=c><b>' + esc(v) + '</b><i>' + esc(l) + '</i></div>').join('');
    // ---- vista de cima: azulejos Esri (Web Mercator) num canvas, o trilho por cima
    const merc = (lo, la) => [lo / 180 * 20037508.342789244, Math.log(Math.tan(Math.PI / 4 + la * Math.PI / 360)) * 6378137];
    const M2 = 20037508.342789244;
    const mapaC = $("mapa2d"), gm = mapaC.getContext('2d');
    const dpr = Math.min(2, window.devicePixelRatio || 1);
    const larguraCss = Math.min(720, mapaC.parentNode.clientWidth || 700);
    mapaC.width = Math.round(larguraCss * dpr); mapaC.height = Math.round(larguraCss * 0.75 * dpr);
    mapaC.style.height = Math.round(larguraCss * 0.75) + 'px';
    const mm = t.pts.map((p) => merc(p.lo, p.la));
    let x0 = Math.min(...mm.map((q) => q[0])), x1 = Math.max(...mm.map((q) => q[0]));
    let y0 = Math.min(...mm.map((q) => q[1])), y1 = Math.max(...mm.map((q) => q[1]));
    const marg = Math.max(300, (x1 - x0) * 0.12, (y1 - y0) * 0.12);
    x0 -= marg; x1 += marg; y0 -= marg; y1 += marg;
    // manter a proporcao do canvas
    const razao = mapaC.height / mapaC.width;
    if ((y1 - y0) / (x1 - x0) < razao) { const c = (y0 + y1) / 2, h2 = (x1 - x0) * razao / 2; y0 = c - h2; y1 = c + h2; }
    else { const c = (x0 + x1) / 2, w2 = (y1 - y0) / razao / 2; x0 = c - w2; x1 = c + w2; }
    // zoom: o que da ~1 px de ecra por pixel de azulejo
    let z = 17;
    while (z > 12 && (x1 - x0) / (2 * M2 / Math.pow(2, z) / 256) > mapaC.width) z--;
    const tam = 2 * M2 / Math.pow(2, z), sx = mapaC.width / (x1 - x0), sy = mapaC.height / (y1 - y0);
    const X2 = (x) => (x - x0) * sx, Y2 = (y) => (y1 - y) * sy;
    const tx0 = Math.floor((x0 + M2) / tam), tx1 = Math.floor((x1 + M2) / tam);
    const ty0 = Math.floor((M2 - y1) / tam), ty1 = Math.floor((M2 - y0) / tam);
    let cursorIdx = 0;
    const pintaMapa = () => {
      gm.setTransform(1, 0, 0, 1, 0, 0);
      // fundo ja tem os azulejos (desenhados a medida que chegam); trilho por cima
      gm.lineWidth = 4 * dpr; gm.lineJoin = 'round'; gm.lineCap = 'round';
      gm.strokeStyle = 'rgba(255,253,246,.9)'; gm.beginPath();
      mm.forEach((q, i) => i ? gm.lineTo(X2(q[0]), Y2(q[1])) : gm.moveTo(X2(q[0]), Y2(q[1]))); gm.stroke();
      gm.lineWidth = 2.2 * dpr; gm.strokeStyle = '#D8302B'; gm.stroke();
      const pt = (q, cor, r) => { gm.beginPath(); gm.arc(X2(q[0]), Y2(q[1]), r * dpr, 0, 6.283); gm.fillStyle = cor; gm.fill(); gm.strokeStyle = '#fff'; gm.lineWidth = 1.5 * dpr; gm.stroke(); };
      pt(mm[0], '#2a8f4a', 5); pt(mm[mm.length - 1], '#3A3226', 5);
      pt(mm[Math.min(mm.length - 1, cursorIdx)], '#1E5BD8', 6);
    };
    const fundo = document.createElement('canvas'); fundo.width = mapaC.width; fundo.height = mapaC.height;
    const gf = fundo.getContext('2d'); gf.fillStyle = '#8a8f7a'; gf.fillRect(0, 0, fundo.width, fundo.height);
    const redesenha = () => { gm.setTransform(1, 0, 0, 1, 0, 0); gm.drawImage(fundo, 0, 0); pintaMapa(); };
    redesenha();
    let azFaltam = 0;
    for (let tx = tx0; tx <= tx1; tx++) for (let ty = ty0; ty <= ty1; ty++) {
      azFaltam++;
      const im = new Image(); im.crossOrigin = 'anonymous';
      im.onload = () => { const ex0 = tx * tam - M2, ey1 = M2 - ty * tam;
        gf.drawImage(im, X2(ex0), Y2(ey1), tam * sx, tam * sy); azFaltam--; redesenha(); };
      im.onerror = () => { azFaltam--; };
      im.src = 'https://server.arcgisonline.com/ArcGIS/rest/services/World_Imagery/MapServer/tile/' + z + '/' + ty + '/' + tx;
    }
    $('mapaNota').textContent = 'Esri, Maxar, Earthstar Geographics · z' + z;

    // perfil
    const W = 700, H = 220, m = { l: 44, r: 10, t: 10, b: 26 };
    const zs = e.z, ac = e.acum, n = zs.length, zmin = e.zmin - 20, zmax = e.zmax + 20;
    const X = (i) => m.l + ac[i] / ac[n - 1] * (W - m.l - m.r), Y = (z) => m.t + (1 - (z - zmin) / (zmax - zmin)) * (H - m.t - m.b);
    let d = 'M' + X(0) + ',' + Y(zs[0]); for (let i = 1; i < n; i++) d += 'L' + X(i).toFixed(1) + ',' + Y(zs[i]).toFixed(1);
    let eixos = '';
    for (let z = Math.ceil(zmin / 100) * 100; z <= zmax; z += 100) eixos += '<line x1="' + m.l + '" x2="' + (W - m.r) + '" y1="' + Y(z) + '" y2="' + Y(z) + '" stroke="#eee"/><text x="4" y="' + (Y(z) + 4) + '" font-size="11" fill="#8A8270">' + z + '</text>';
    for (let k = 0; k <= Math.floor(ac[n - 1] / 1000); k++) { const x = m.l + k * 1000 / ac[n - 1] * (W - m.l - m.r); eixos += '<text x="' + x + '" y="' + (H - 8) + '" font-size="11" fill="#8A8270" text-anchor="middle">' + k + '</text>'; }
    $('perfil').innerHTML = '<svg viewBox="0 0 ' + W + ' ' + H + '">' + eixos + '<path d="' + d + 'L' + X(n - 1) + ',' + Y(zmin) + 'L' + X(0) + ',' + Y(zmin) + 'Z" fill="#E8DFC8"/><path d="' + d + '" fill="none" stroke="#A0522D" stroke-width="2"/>'
      + '<line id=cur x1="' + X(0) + '" x2="' + X(0) + '" y1="' + m.t + '" y2="' + (H - m.b) + '" stroke="#1E5BD8" stroke-width="1.5"/>'
      + '<circle id=curP cx="' + X(0) + '" cy="' + Y(zs[0]) + '" r="4" fill="#1E5BD8" stroke="#fff" stroke-width="1.5"/></svg>';
    // cursor: arrastar no perfil move a linha e o ponto no mapa (o perfil e
    // sobre os pontos simplificados; o mapa usa os originais -> mapear por distancia)
    const svg = $('perfil').querySelector('svg');
    const acumOrig = [0]; for (let i = 1; i < t.pts.length; i++) acumOrig.push(acumOrig[i - 1] + metros(t.pts[i - 1], t.pts[i]));
    const idxOrig = (dist) => { let lo = 0, hi = acumOrig.length - 1; while (lo < hi) { const mid = (lo + hi) >> 1; if (acumOrig[mid] < dist) lo = mid + 1; else hi = mid; } return lo; };
    const move = (ev) => {
      const r = svg.getBoundingClientRect(); const fx = (ev.clientX - r.left) / r.width * W;
      let i = Math.round((fx - m.l) / (W - m.l - m.r) * (n - 1)); i = Math.max(0, Math.min(n - 1, i));
      svg.querySelector('#cur').setAttribute('x1', X(i)); svg.querySelector('#cur').setAttribute('x2', X(i));
      svg.querySelector('#curP').setAttribute('cx', X(i)); svg.querySelector('#curP').setAttribute('cy', Y(zs[i]));
      cursorIdx = idxOrig(ac[i] / ac[n - 1] * acumOrig[acumOrig.length - 1]);   // por fraccao: os pontos originais somam mais (tremura do GPS)
      $('perfilNota').textContent = '(' + (ac[i] / 1000).toFixed(2).replace('.', ',') + ' km · ' + Math.round(zs[i]) + ' m)';
      redesenha();
    };
    let aArrastar = false;
    svg.addEventListener('pointerdown', (ev) => { aArrastar = true; svg.setPointerCapture(ev.pointerId); move(ev); });
    svg.addEventListener('pointermove', (ev) => { if (aArrastar) move(ev); });
    svg.addEventListener('pointerup', () => { aArrastar = false; });
    svg.addEventListener('pointercancel', () => { aArrastar = false; });
    // sol por hora (sombra do monte), com a data de hoje ou a do trilho
    const dia = t.pts.find((p) => p.t) ? new Date(t.pts.find((p) => p.t).t) : new Date();
    let tab = '<table><tr><th>hora</th><th>ao sol (monte)</th><th></th></tr>';
    for (let h = 6; h <= 20; h++) {
      const qd = new Date(dia); qd.setHours(h, 0, 0, 0);
      let ao = 0, dn = 0;
      for (const Z of Ts) { const s = solNoTrilho(Z, t.pts, qd); if (s && s.dentro) { ao += s.pct / 100 * s.dentro; dn += s.dentro; } }
      const pct = dn ? 100 * ao / dn : null;
      tab += '<tr><td>' + String(h).padStart(2, '0') + ':00</td><td>' + (pct == null ? '—' : pct.toFixed(0) + ' %') + '</td><td style="width:50%"><div class=barra style="margin:0"><i style="flex:' + (pct || 0) + ';background:#E8A33D"></i><i style="flex:' + (pct == null ? 0 : 100 - pct) + ';background:#6E7A86"></i></div></td></tr>';
    }
    tab += '</table>';
    let andou = '';
    if (t.pts.some((p) => p.t)) {
      let ao = 0, dn = 0; for (const Z of Ts) { const s = solNoTrilho(Z, t.pts, dia, { horaPropria: true }); if (s && s.dentro) { ao += s.pct / 100 * s.dentro; dn += s.dentro; } }
      if (dn) andou = '<p><b>' + (100 * ao / dn).toFixed(0) + ' % ao sol quando o andaste</b> (cada ponto à sua hora, sombra do monte).</p>';
    }
    $('solNota').textContent = '(' + dia.toLocaleDateString('pt-PT') + ', sombra do monte; a copa é à parte)';
    $('sol').innerHTML = andou + tab;
    $('estado').textContent = '';
  } catch (err) { $('estado').textContent = 'Não deu: ' + err.message; }
})();
</script>
</body>
</html>
