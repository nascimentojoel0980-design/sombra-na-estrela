<!doctype html>
<html lang="pt">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Teste DGT</title>
<style>
 :root{color-scheme:light dark}
 body{font:16px/1.5 system-ui,sans-serif;margin:0;padding:16px;max-width:720px;margin-inline:auto}
 h1{font-size:20px;margin:0 0 4px}
 p.sub{margin:0 0 16px;opacity:.7;font-size:14px}
 button{display:block;width:100%;padding:14px;margin:8px 0;font-size:16px;border-radius:10px;border:1px solid #8886;background:#8881}
 button:disabled{opacity:.5}
 #go{border-color:#2a7;border-width:2px;font-weight:600}
 pre{white-space:pre-wrap;word-break:break-word;background:#8881;padding:12px;border-radius:10px;font-size:13px;min-height:80px}
</style>
</head>
<body>
<h1>Teste de velocidade da DGT</h1>
<p class="sub">Mede o tempo por pedido da mesma maneira que o mapa os faz. Não guarda nada.</p>
<button id="go">Correr tudo e comparar</button>
<button id="cors">Verificar se dá para guardar (CORS)</button>
<pre id="out">pronto.</pre>
<script>
const WMS='https://cartografia.dgterritorio.gov.pt/wms/ortos2025';
const R=20037508.342789244;
// Manteigas
const BASE={x:251163,y:197721};   // em z19
function url(z,x,y,px){
  const n=2**z,s=2*R/n,x0=-R+x*s,y1=R-y*s,x1=x0+s,y0=y1-s;
  return WMS+'?service=WMS&version=1.3.0&request=GetMap&layers=Ortos2025-RGB&styles='
   +'&crs=EPSG:3857&format=image/jpeg&width='+px+'&height='+px
   +'&bbox='+x0.toFixed(1)+','+y0.toFixed(1)+','+x1.toFixed(1)+','+y1.toFixed(1)
   +'&nc='+Math.random().toString(36).slice(2);
}
const ZP={256:19,512:18,1024:17,2048:16};
function lista(px,n){
  const z=ZP[px],d=19-z,bx=BASE.x>>d,by=BASE.y>>d,out=[];
  for(let i=0;i<n;i++) out.push(url(z,bx+(i%6),by+Math.floor(i/6),px));
  return out;
}
const out=document.getElementById('out');
const log=t=>out.textContent+='\n'+t;
function pedeImg(u){
  return new Promise((ok)=>{
    const im=new Image();
    const t=setTimeout(()=>{im.src='';ok(false)},30000);
    im.onload=()=>{clearTimeout(t);ok(im.naturalWidth>1)};
    im.onerror=()=>{clearTimeout(t);ok(false)};
    im.src=u;
  });
}
async function corre(px,par,n){
  const us=lista(px,n);let i=0,ok=0,mau=0;
  const t0=performance.now();
  async function w(){while(i<us.length){ (await pedeImg(us[i++])) ? ok++ : mau++; }}
  await Promise.all(Array.from({length:par},w));
  const seg=(performance.now()-t0)/1000;
  const m=40075017*Math.cos(40.4*Math.PI/180)/(2**ZP[px]);
  const km2=m*m/1e6*ok;
  const r={px,par,ok,mau,seg:+seg.toFixed(1),ms:Math.round(seg*1000/Math.max(1,ok)),km2min:+(km2/seg*60).toFixed(1)};
  log(px+' px, '+par+' em paralelo: '+ok+' ok, '+mau+' falhas, '+r.seg+' s\n'
    +'   '+r.ms+' ms/pedido (efectivo)\n   >>> '+r.km2min+' km2 por minuto');
  return r;
}
document.getElementById('go').onclick=async()=>{
  document.querySelectorAll('button').forEach(b=>b.disabled=true);
  out.textContent='a medir, 1 a 3 minutos. nao mudes de app.';
  const rs=[];
  try{
    rs.push(await corre(256,1,10));
    rs.push(await corre(256,6,24));
    rs.push(await corre(1024,1,4));
    rs.push(await corre(1024,6,12));
    rs.push(await corre(2048,3,6));
    rs.sort((a,b)=>b.km2min-a.km2min);
    log('\n===== MELHOR =====\n'+rs.map(r=>r.px+'px x'+r.par+' -> '+r.km2min+' km2/min ('+r.mau+' falhas)').join('\n'));
  }catch(e){log('ERRO '+e)}
  document.querySelectorAll('button').forEach(b=>b.disabled=false);
};
document.getElementById('cors').onclick=async()=>{
  document.querySelectorAll('button').forEach(b=>b.disabled=true);
  out.textContent='a verificar...';
  for(const px of [256,1024,2048]){
    const u=lista(px,1)[0];
    try{
      const r=await fetch(u,{cache:'no-store'});
      const b=await r.blob();
      log(px+' px: HTTP '+r.status+' · '+Math.round(b.size/1024)+' KB · tipo '+b.type);
    }catch(e){log(px+' px: FALHOU no fetch -> '+e.name+': '+e.message)}
  }
  document.querySelectorAll('button').forEach(b=>b.disabled=false);
};
</script>
</body>
</html>
