<!doctype html>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no">
<title>Terreno de raiz — Vale Glaciar de Manteigas</title>
<meta http-equiv="Cache-Control" content="no-cache">
<style>
  html,body{margin:0;height:100%;background:#DED9C8;overflow:hidden;
    font:14px/1.4 system-ui,-apple-system,"Segoe UI",sans-serif;color:#2C2A24;
    -webkit-user-select:none;user-select:none;touch-action:none}
  canvas{display:block;width:100%;height:100%;position:fixed;inset:0}
  .caixa{background:rgba(255,253,246,.93);border-radius:11px;
    box-shadow:0 2px 10px rgba(0,0,0,.16)}
  #hud{position:fixed;left:8px;top:8px;padding:8px 11px;white-space:pre;
    font-variant-numeric:tabular-nums;font-size:12px;line-height:1.5;z-index:5}
  #sol{position:fixed;left:8px;right:8px;bottom:8px;padding:9px 12px;z-index:5;
    display:flex;align-items:center;gap:10px;font-size:12.5px}
  #sol input[type=range]{flex:1;min-width:60px;accent-color:#C8761F}
  #solTxt{font-variant-numeric:tabular-nums;white-space:nowrap;font-weight:600}
  #bts{position:fixed;right:8px;top:50%;transform:translateY(-50%);z-index:5;
    display:grid;grid-template-columns:44px;gap:7px}
  #bts button{width:44px;height:44px;border:0;border-radius:11px;
    background:rgba(255,253,246,.94);box-shadow:0 2px 8px rgba(0,0,0,.18);
    font-size:19px;color:#2C2A24;touch-action:none;cursor:pointer}
  #bts button:active{background:#E8E2D2}
  #bts button.on{background:#2E6B4F;color:#fff}
  #rotulos{position:fixed;inset:0;pointer-events:none;z-index:4;overflow:hidden}
  .r{position:absolute;transform:translate(-50%,-100%);white-space:nowrap;
    font-size:11px;line-height:1.1;text-shadow:0 0 3px #FFFDF6,0 0 3px #FFFDF6,0 0 5px #FFFDF6;
    color:#3A3226}
  .r b{display:block;font-weight:600}
  .r.cume{color:#5B4426}
  .r.povoacao{color:#2C2A24;font-size:12px}
  .r.agua{color:#2A5A79}
</style>
<canvas id=c></canvas>
<div id=rotulos></div>
<div id=hud class=caixa>a carregar…</div>
<div id=bts>
  <button data-a=mais title="aproximar">+</button>
  <button data-a=menos title="afastar">−</button>
  <button data-a=esq title="rodar para a esquerda">⟲</button>
  <button data-a=dir title="rodar para a direita">⟳</button>
  <button data-a=cima title="levantar a câmara">▲</button>
  <button data-a=baixo title="deitar a câmara">▼</button>
  <button data-a=curvas title="curvas de nível" class=on>≡</button>
  <button data-a=nomes title="nomes" class=on>A</button>
</div>
<div id=sol class=caixa>
  <span>☀</span>
  <input id=hora type=range min=0 max=1439 step=5>
  <span id=solTxt></span>
</div>
<script src="fonte/terreno.js?v=7"></script>
<script>
const VER = '7';
// O nome do ficheiro leva a versao do FORMATO, nao so uma query. O service
// worker antigo serve tudo o que esta em dados/ pela cache e com ignoreSearch,
// ou seja a ignorar o ?v= -- so mudando o caminho e que a copia velha deixa de
// aparecer. Foi assim que ele apanhou o formato 1 depois de eu publicar o 2.
const FICHEIRO = 'dados/terreno/manteigas-v2.terr.gz?v=' + VER;
const cv = document.getElementById('c'), hud = document.getElementById('hud');
let V = null, T = null;

async function arranca() {
  const t0 = performance.now();
  T = await carregaTerreno(FICHEIRO);
  const ler = performance.now() - t0;
  hud.textContent = 'a construir a malha e a semear a caixa toda, uma vez…';
  await new Promise((r) => setTimeout(r, 0));
  V = abreVista(cv, T, {
    camadaRotulos: document.getElementById('rotulos'),
    aoDesenhar: () => { if ((++nF & 3) === 0) mostra(ler); },
  });
  const agora = new Date();
  document.getElementById('hora').value = agora.getHours() * 60 + agora.getMinutes();
  mudaHora();
  window.PRONTO = true; window.V = V; window.T = T;
  window.CAM = V.cam; window.MOSTRAR = V.mostrar; window.CONTA = V.conta;
}
let nF = 0;
const rumoTxt = (a) => ['N','NE','E','SE','S','SO','O','NO'][Math.round(a / 45) % 8];
function mudaHora() {
  const m = +document.getElementById('hora').value;
  const q = new Date(); q.setHours(m / 60 | 0, m % 60, 0, 0);
  const s = V.hora(q);
  const hh = String(m / 60 | 0).padStart(2, '0'), mm = String(m % 60).padStart(2, '0');
  document.getElementById('solTxt').textContent =
    hh + ':' + mm + (s.alt > 0 ? '  ' + s.alt.toFixed(0) + '° ' + rumoTxt(s.az) : '  sol posto');
}
document.getElementById('hora').addEventListener('input', () => mudaHora());

function mostra(ler) {
  const c = V.conta, r = V.ritmo();
  hud.textContent =
`Vale Glaciar de Manteigas   ${(T.larg/1000).toFixed(1)} x ${(T.alt/1000).toFixed(1)} km
plantas cozidas   ${c.total.toLocaleString('pt-PT')}
a desenhar        ${c.desenhadas.toLocaleString('pt-PT')}  (${(100*c.desenhadas/c.total).toFixed(1)}%)
chao              ${c.triChao.toLocaleString('pt-PT')} triangulos em ${c.blocosChao} blocos
fotograma         ${r.toFixed(1)} ms  (${(1000/Math.max(r,0.01)).toFixed(0)} fps)
arranque          ler ${ler.toFixed(0)} + malha ${c.malha.toFixed(0)} + semear ${c.semear.toFixed(0)} ms
construido a andar  0 ms`;
}

addEventListener('keydown', (e) => {
  if (!V) return;
  const k = e.key;
  if (k === '+' || k === '=') V.aproxima(0.8);
  else if (k === '-') V.aproxima(1.25);
  else if (k === 'ArrowLeft') V.roda(-0.12);
  else if (k === 'ArrowRight') V.roda(0.12);
  else if (k === 'ArrowUp') V.inclina(-0.08);
  else if (k === 'ArrowDown') V.inclina(0.08);
  else return;
  e.preventDefault();
});
for (const b of document.querySelectorAll('#bts button')) {
  const a = b.dataset.a;
  if (a === 'curvas' || a === 'nomes') {
    b.addEventListener('click', () => { if (!V) return;
      V.mostrar[a] = !V.mostrar[a]; b.classList.toggle('on', V.mostrar[a]); });
    continue;
  }
  let t = null;
  const faz = () => { if (!V) return;
    if (a === 'mais') V.aproxima(0.86); else if (a === 'menos') V.aproxima(1.16);
    else if (a === 'esq') V.roda(-0.09); else if (a === 'dir') V.roda(0.09);
    else if (a === 'cima') V.inclina(-0.06); else if (a === 'baixo') V.inclina(0.06); };
  b.addEventListener('pointerdown', (e) => { e.preventDefault(); e.stopPropagation(); faz(); t = setInterval(faz, 90); });
  const para = () => { if (t) { clearInterval(t); t = null; } };
  b.addEventListener('pointerup', para);
  b.addEventListener('pointercancel', para);
  b.addEventListener('pointerleave', para);
}
arranca().catch((e) => { hud.textContent = 'erro: ' + e.message; console.error(e); });
</script>
